<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="LIVE HEIST — Costa Vidrio: an open-world crime game where the whole city livestreams your heists. Steal cars, outrun Vidrio PD, cut the feed.">
<title>LIVE HEIST — Costa Vidrio</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #14161f;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: linear-gradient(160deg, #ff7a1a 0%, #ff4d8d 55%, #1a1033 100%);
  }
  #game {
    width: 1280px;
    height: 720px;
    max-width: 100vw;
    max-height: 100vh;
    display: block;
    background: #8fae6b;
    box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.15), 0 24px 80px rgba(0, 0, 0, 0.55);
    cursor: crosshair;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
